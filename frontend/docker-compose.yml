services:
  backend:
    build: .
    container_name: estore_backend
    ports:
      - "5001:5001"
    environment:
      PORT: 5001

      # MySQL
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: estore

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mysql
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

  redis:
    image: redis:7.4-alpine
    container_name: estore_redis
    ports:
      - "6379:6379"
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: estore_redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data
    restart: always

  mysql:
    image: mysql:8.0.43
    container_name: estore_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estore
    ports:
      - "3307:3306"   # 🔥 FIXED
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
  redisinsight_data:
